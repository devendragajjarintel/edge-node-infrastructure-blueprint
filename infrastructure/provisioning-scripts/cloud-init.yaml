# shellcheck disable=all

growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false

resize_rootfs: true

# Cloud-config file to start the k3s cluster.
runcmd:
  - |
    # Create an 8GB swap file if no swap is already active/configured
    if [ -z "$(swapon --show --noheadings)" ] && [ ! -f /swapfile ]; then
      fallocate -l 8G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=8192
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      if ! grep -q '^/swapfile ' /etc/fstab; then
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi
    fi
  - |
    # Allow helm/kubectl access from external development system
    iptables -A INPUT -p tcp --dport 6443 -j ACCEPT
    . /etc/environment

