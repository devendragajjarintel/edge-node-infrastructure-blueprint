# shellcheck disable=all

growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false

resize_rootfs: true

# Cloud-config file to start the k3s cluster.
runcmd:
  - |
    # If a swap device is active but its size is 0, recreate a 4GB swap file
    total_swap_bytes=$(swapon --show=SIZE --bytes --noheadings | awk '{sum+=$1} END {print sum+0}')
    if [ "$total_swap_bytes" -eq 0 ] && [ ! -f /swapfile ]; then
      fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      if ! grep -q '^/swapfile ' /etc/fstab; then
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi
    fi
  - |
    # Allow helm/kubectl access from external development system
    iptables -A INPUT -p tcp --dport 6443 -j ACCEPT
    . /etc/environment

